# Configuration for the public live demo, built by GitHub Actions (.github/workflows/demo.yml).
# Everything not set here uses the defaults: GRBBeta, polite SatNOGS polling, NOAA space weather.

[station]
name = "Greenwich"        # Royal Observatory, a neutral spot for "next pass over you" on the demo
lat = 51.478
lon = -0.0015

[storage]
db = "demo/data/downlink-desk.db"

[satnogs]
token_file = "demo/no-token-file"   # the API key comes from the SATNOGS_TOKEN repository secret
history_days = 14                   # enough for the health model and battery check; keeps the first run short
