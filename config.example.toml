# Downlink Desk configuration. Copy to config.toml and edit.
# Paths are relative to this file's folder.

[satellite]
norad = 60237                       # GRBBeta, a 2U CubeSat from TUKE (Slovakia). The first satellite;
                                    # add more from the satellite picker in the console.
name = "GRBBeta"
decoder = "grbbeta"                 # decoder name in the satnogs-decoders package
channels = "channels/grbbeta.json"  # which decoded fields to show, with units and limits

[satnogs]
api = "https://db.satnogs.org/api"
network_api = "https://network.satnogs.org/api"   # public schedule of which stations will listen, and when
token_file = "secrets/satnogs_token"  # your SatNOGS DB API key (db.satnogs.org > avatar > Settings/API Token)
poll_minutes = 30                   # please keep this at 20 or more; SatNOGS is volunteer-run
max_pages = 4                       # pages per fetch once caught up
upload_lookback_hours = 6           # re-check this far back for passes stations upload late
backfill_pages = 6                  # pages on the very first fetch
history_days = 21                   # fill in this much history, a little at each fetch, so the health model has data
history_pages_per_fetch = 8         # pages of history per fetch (25 frames each, 11 s apart)

[station]
# Your location, used to predict when the satellite passes over you.
name = "Home"
lat = 0.0
lon = 0.0
alt_m = 0
min_elevation = 10

[server]
host = "0.0.0.0"
port = 8080
write_passcode = ""                 # optional: require this passcode for acknowledgements, notes and changes

[storage]
db = "data/downlink-desk.db"

[alerts]
stale_hours = 12                    # caution when no new frames arrive for this long (alarm at twice this)
upload_grace_hours = 3              # how long after a scheduled observation to wait for its frames
silent_after = 3                    # alarm when this many scheduled observations in a row deliver nothing
min_obs_elevation = 15              # ignore very low passes when judging silence (degrees)

[notify]
# Phone alerts via ntfy: install the free ntfy app, subscribe to a topic name only you know
# (e.g. "downlink-desk-7f3k9q"), and put the same name here. Leave blank to turn alerts off.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"
console_url = ""                    # optional: link opened when you tap an alert, e.g. http://groundpi.local:8080
summary_hour = 7                    # morning summary at this local hour (-1 to turn it off)
timezone = ""                       # e.g. "Asia/Ho_Chi_Minh"; blank uses the Pi's own time zone (often UTC)

[spaceweather]
# Geomagnetic storms, solar flares and solar flux from NOAA's Space Weather Prediction Center.
# Public data, no key needed, fetched every 3 hours.
enabled = true
api = "https://services.swpc.noaa.gov"

[updates]
# The Pi checks GitHub 5 minutes after boot and every night at about 03:30, and updates itself when
# there's a clean new version (it rolls back if the console doesn't come back). false = only report.
auto_update = true

[lattice]
# Optional: publish this node, its satellites and the SatNOGS stations due to hear them to Anduril
# Lattice, and accept ExpeditePass tasks. See docs/ICD-LATTICE.md. Runs as its own service
# (downlink-desk-lattice); the console works the same with it off.
enabled = false
url = ""                            # your Lattice environment, e.g. "lattice-abc123.env.sandboxes.developer.anduril.com"
token_file = "secrets/lattice_token"            # environment (bearer) token, or leave empty and use client_id
client_id = ""                                  # OAuth client credentials, if your environment gives them
client_secret_file = "secrets/lattice_client_secret"
sandbox_token_file = "secrets/lattice_sandbox_token"   # Lattice Sandboxes only
node_name = ""                      # name shown in Lattice; blank uses [station] name
node_location = "rounded"           # this node's position in Lattice: "rounded" (0.1°, about 10 km), "exact" or "none"
publish_seconds = 30                # Lattice marks an asset offline after about a minute without updates
station_minutes = 5                 # how often to publish the SatNOGS stations due to hear your satellites
expiry_minutes = 15                 # entities disappear from Lattice this long after the bridge stops
tasks = true                        # accept ExpeditePass tasks
expedite_minutes = 10               # while expediting a pass, fetch that satellite this often (5 at least)
max_tasks = 3
simulated = false                   # mark entities as simulated (for the training simulator or a mock)
