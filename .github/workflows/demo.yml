# Builds the public live demo: fetches real GRBBeta telemetry from SatNOGS every 6 hours with the
# same code a Raspberry Pi runs, then publishes a read-only snapshot of the console to GitHub Pages.
#
# One-time setup (repository Settings):
#   Secrets and variables > Actions > New repository secret: SATNOGS_TOKEN = your SatNOGS DB API key
#   Pages > Build and deployment > Source: GitHub Actions
name: Live demo
# Third-party steps are pinned to exact commits (tags can be moved); the comment shows the version.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "downlink_desk/**", "channels/**", "catalog/**", "demo-config.toml", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore the demo database from the last run
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: demo/data
          key: demo-db-${{ github.run_id }}
          restore-keys: demo-db-

      # A code push only rebuilds the page from the data we already have; SatNOGS is asked
      # on the 6-hour schedule (or a manual run) and nowhere else.
      - name: Fetch from SatNOGS (and fill in two weeks of history on the first run)
        if: github.event_name != 'push'
        env:
          SATNOGS_TOKEN: ${{ secrets.SATNOGS_TOKEN }}
        run: |
          if [ -z "$SATNOGS_TOKEN" ]; then
            echo "::error::Add your SatNOGS DB API key as a repository secret called SATNOGS_TOKEN"; exit 1
          fi
          mkdir -p demo/data
          python -u -m downlink_desk.fetch --config demo-config.toml --force \
            || echo "::warning::SatNOGS fetch had a problem; publishing the data we have"
          python -u -m downlink_desk.fetch --config demo-config.toml --history 14 \
            || echo "::warning::History fill stopped early; it carries on next run"

      - name: Save the demo database for the next run
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: demo/data
          key: demo-db-${{ github.run_id }}

      - name: Export the read-only console
        run: python -m downlink_desk.export_static --config demo-config.toml --out site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
